name: Deploy ZELO Review SaaS to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Ejecutar Git Pull, Prisma Migrations y Build en VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "2.25.102.198"
          username: "root"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git config --global --add safe.directory /var/www/zelo-review
            cd /var/www/zelo-review
            
            echo "📥 Obteniendo últimos cambios del repositorio..."
            git pull origin main || git pull origin master

            echo "📦 Instalando dependencias..."
            npm install --legacy-peer-deps

            echo "🗄️ Generando cliente Prisma y sincronizando base de datos..."
            npx prisma generate
            npx prisma db push

            echo "🏗️ Compilando aplicación Next.js en producción..."
            npm run build

            echo "⚙️ Configurando permisos..."
            chown -R www-data:www-data /var/www/zelo-review 2>/dev/null || true

            echo "🔄 Reiniciando servicio con PM2..."
            npm install pm2 -g || true
            pm2 restart zelo-review || pm2 start npm --name "zelo-review" -- start -- -p 3000
            pm2 save

            echo "🌐 Recargando servidor web Nginx / Caddy..."
            systemctl reload nginx 2>/dev/null || true

            echo "✨ ¡ZELO Review desplegado exitosamente en producción!"
