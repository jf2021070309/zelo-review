name: Deploy ZELO Review SaaS to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Desplegar cambios en VPS vía SSH (MySQL Nativo)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "2.25.102.198"
          username: "root"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git config --global --add safe.directory /var/www/zelo-review
            cd /var/www/zelo-review
            
            echo "📥 Limpiando y obteniendo últimos cambios del repositorio..."
            git reset --hard HEAD || true
            git checkout main || git checkout master || true
            git pull origin main || git pull origin master

            echo "📦 Instalando dependencias (mysql2)..."
            npm install --legacy-peer-deps

            echo "🗄️ Sincronizando base de datos MariaDB / MySQL..."
            mariadb < schema_mysql.sql 2>/dev/null || mysql < schema_mysql.sql 2>/dev/null || true

            echo "🏗️ Compilando aplicación Next.js en producción..."
            npm run build

            echo "⚙️ Configurando permisos..."
            chown -R www-data:www-data /var/www/zelo-review 2>/dev/null || true

            echo "🔄 Reiniciando servicio con PM2..."
            npm install pm2 -g || true
            pm2 restart zelo-review || pm2 start npm --name "zelo-review" -- start -- -p 3000
            pm2 save

            echo "🌐 Recargando servidor web Nginx / Caddy..."
            systemctl reload nginx 2>/dev/null || true

            echo "✨ ¡ZELO Review desplegado exitosamente con MySQL sin Prisma!"
