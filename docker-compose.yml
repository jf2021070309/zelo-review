version: "3.8"

services:
  # Base de Datos MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: zelo_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zelo_root_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zelo_db}
      MYSQL_USER: ${MYSQL_USER:-zelo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zelo_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - zelo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pzelo_root_pass_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Next.js Full-Stack
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zelo_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-zelo}:${MYSQL_PASSWORD:-zelo_secure_pass_2026}@mysql:3306/${MYSQL_DATABASE:-zelo_db}
      JWT_SECRET: ${JWT_SECRET:-zelo_super_secret_jwt_key_928374829374829374928374982374}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:-zelo-admin-master-2026}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://2.25.102.198}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-jaime.flores01@zelo.com.mx}
      SMTP_PASS: ${SMTP_PASS:-cwiE6uc&}
      EMAIL_FROM: ${EMAIL_FROM:-"ZELO Review" <jaime.flores01@zelo.com.mx>}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3000:3000"
    networks:
      - zelo_network

  # Caddy Reverse Proxy con SSL Automático
  caddy:
    image: caddy:2-alpine
    container_name: zelo_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - zelo_network

networks:
  zelo_network:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
